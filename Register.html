<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Regsiter.css">
    <title>Register</title>
</head>
<body>
    <main class ="register">
        <div class ="register-glass">
                <p class ="titel"> Start your Journey!</p>

                <form class = "register-form">
                  <div class="input-group">
                     <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email" required>
                             </div>

                     <div class="input-group">
                        <label for="password">Password</label>
                         <input type="password"id="password" name="password" placeholder="Create a password" autocomplete="new-password" minlength="8"required>
                    </div>
                       <div class="input-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password"id="confirm-password" name="confirm-password" placeholder="Confirm your password" autocomplete="new-password" minlength="8" required>
                </div>

                 <button type="submit" class="register-button">CREATE ACCOUNT </button>
                     <p class="login-text">Already have an account? 
                         <a href="Login.html">Log In</a>
                              </p>

                

            </form>
        </div>

        <div class="floating-stickers">
        <span class="sticker sticker-1">⭐</span>
        <span class="sticker sticker-2">⚡</span>
        <span class="sticker sticker-3">🎮</span>
        <span class="sticker sticker-4">📚</span>
        <span class="sticker sticker-5">💜</span>
        <span class="sticker sticker-6">✦</span>
        <span class="sticker sticker-7">❓</span>
        <span class="sticker sticker-8">🚀</span>
        </div>    
    </main>

    
</body>
</html>
